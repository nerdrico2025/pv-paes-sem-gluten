<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <script>
      (function(){
        var h = location.hash;
        if (h) {
          // Aceita padrões como "#/rota" ou "#rota"
          var hasSlash = h.startsWith('#/');
          var path = hasSlash ? h.slice(1) : '/' + h.slice(1);
          // Mantém query string, remove apenas o hash
          if (path && path !== '/#' && path !== '/%23' && path !== '/#/' && path !== '/%23/') {
            var qs = location.search || '';
            try { sessionStorage.setItem('hash_redirect_to', path + '|' + Date.now()); } catch (e) { void e }
            location.replace(path + qs);
          }
        }
      })();
    </script>
